name: equipment_app
description: Arabic owner-alone equipment management — isolated development slice.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  http: 1.6.0
  file_selector: 1.1.0
  flutter_secure_storage: 11.2.0
  cross_file: 0.3.5+5
  path_provider: 2.1.6
  open_filex: 4.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  generate: true
  uses-material-design: true
  assets:
    - integration_test/fixtures/synthetic-receipt.png
    - assets/design_fonts/
    - assets/typography_fonts/
  fonts:
    - family: EquipmentAlmarai
      fonts:
        - asset: assets/typography_fonts/Almarai-Regular.ttf
          weight: 400
        - asset: assets/typography_fonts/Almarai-Bold.ttf
          weight: 700
    - family: EquipmentPlex
      fonts:
        - asset: assets/typography_fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/typography_fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: EquipmentNoto
      fonts:
        - asset: assets/design_fonts/NotoSansArabic[wdth,wght].ttf
