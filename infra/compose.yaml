name: equipment-platform-dev
services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: equipment_dev
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: equipment_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - equipment_dev_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equipment_dev -d equipment_dev"]
      interval: 3s
      timeout: 3s
      retries: 20
  postgres-test:
    image: postgres:17.11
    profiles: ["test"]
    environment:
      POSTGRES_USER: equipment_test
      POSTGRES_PASSWORD: isolated-test-only
      POSTGRES_DB: equipment_test
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - equipment_test_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equipment_test -d equipment_test"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  equipment_dev_db:
  equipment_test_db:
