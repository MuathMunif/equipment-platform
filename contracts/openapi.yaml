openapi: 3.1.0
info:
  title: Equipment Platform — isolated development M7
  version: 0.7.0
  description: |
    Local M7 dashboard and reports over existing optional organizations and projects. Production startup is intentionally rejected.
    Protected resources check active workspace membership, effective capabilities and equipment scope.
    Money is an exact SAR decimal string with two fractional digits (0.01–999999999.99).
    Business dates use YYYY-MM-DD independently of audit instants; UI defaults to Asia/Riyadh.
    Unknown request fields are rejected. IDs, ownership, lifecycle and settled totals are server-owned.
    Idempotency-Key is required for creation. Same authorized normalized payload returns the same
    resource with HTTP 200; a changed payload conflicts (409). Scope includes actor/workspace/action.
    Lists contain at most 30 items and have zero-based pages.
    WEB login sets a session-only HttpOnly SameSite=Strict cookie on /api/v1; authenticated writes
    require X-CSRF-Token returned by /auth/me. No browser credential is stored in localStorage.
    NATIVE login returns an opaque accessToken for OS secure storage and Bearer authentication.
    Sessions expire after 8 hours; no refresh token. Logout revokes immediately; re-login is explicit.
    Dev accepts reserved synthetic +966500000000 through +966500000999 numbers, code 123456.
    OTP expires after 5 minutes, permits 5 attempts, resends at most once per 30 seconds and 10/hour.
    Files are private development filesystem objects, not tested S3 integration. No malware scanner:
    scanStatus is DEV_NOT_SCANNED. PNG/JPEG/PDF only; max 10 MiB, 10 files per entry, 25MP,
    dimensions <=10000, PDF <=100 pages. Encrypted and active-content PDFs are rejected.
    Upload is two-phase. FAILED/PENDING files retry their existing id; READY bytes are immutable.
    File failures never recreate/erase the entry or settlement. Download always rechecks membership.
    Transport exception: Spring's CORS filter rejects an untrusted Origin with HTTP 403 and a
    plain-text body before application error handling. Clients must use status, not assume JSON,
    for this rejection. Application/domain errors use the code/message schema below.
servers:
  - url: http://127.0.0.1:8080/api/v1
security:
  - bearerSession: []
  - cookieSession: []
paths:
  /health:
    get:
      security: []
      responses:
        '200': {description: 'Status and explicit dev/storage/scanner limitations'}
  /auth/challenges:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone]
              properties:
                phone: {type: string, example: '0500000001'}
      responses:
        '200':
          description: Non-enumerating development challenge
          content:
            application/json:
              schema:
                type: object
                required: [challengeId, expiresAt, resendAfterSeconds]
                properties:
                  challengeId: {type: string, format: uuid}
                  expiresAt: {type: string, format: date-time}
                  resendAfterSeconds: {type: integer, const: 30}
        '400': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /auth/verify:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challengeId, code, client]
              properties:
                challengeId: {type: string, format: uuid}
                code: {type: string}
                name: {type: [string, 'null'], maxLength: 100}
                client: {type: string, enum: [WEB, NATIVE]}
      responses:
        '200':
          description: requiresName=true requests name once for a new owner; otherwise authenticated
          content:
            application/json:
              schema:
                type: object
                required: [requiresName]
                properties:
                  requiresName: {type: boolean}
                  csrfToken: {type: string}
                  accessToken: {type: string, description: NATIVE only; never logged}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /auth/me:
    get:
      responses:
        '200':
          description: Current user, current active owned workspaces and session CSRF token
          content:
            application/json:
              schema:
                type: object
                required: [userId, name, preferredLocale, workspaces, csrfToken, development]
                properties:
                  userId: {type: string, format: uuid}
                  name: {type: string}
                  preferredLocale: {type: [string, 'null'], enum: [ar, en, ur, null], description: Null uses a supported device locale then Arabic fallback}
                  csrfToken: {type: string}
                  development: {const: true}
                  workspaces:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string, format: uuid}
                        name: {type: string}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /auth/me/locale:
    put:
      description: Save the authenticated user's language preference across workspaces.
      parameters: [{$ref: '#/components/parameters/Csrf'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preferredLocale]
              properties:
                preferredLocale: {type: string, enum: [ar, en, ur]}
      responses:
        '200': {description: Updated /auth/me representation}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /auth/logout:
    post:
      parameters: [{$ref: '#/components/parameters/Csrf'}]
      responses:
        '200': {description: Session deleted and web cookie expired}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace}/equipment:
    parameters: [{$ref: '#/components/parameters/Workspace'}]
    get:
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {in: query, name: search, schema: {type: string, maxLength: 100}, description: Literal name/reference substring}
        - {in: query, name: organizationId, schema: {type: string, format: uuid}, description: Current optional organization assignment filter}
      responses:
        '200':
          description: Authorized equipment page
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Page'}
                  - {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Equipment'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      parameters: [{$ref: '#/components/parameters/Idempotency'}, {$ref: '#/components/parameters/Csrf'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, model]
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                model: {type: string, minLength: 1, maxLength: 100, description: Free text, not year-only}
      responses:
        '200': {description: Created or authorized replay, content: {application/json: {schema: {$ref: '#/components/schemas/Equipment'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace}/equipment/{id}:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    get:
      responses:
        '200': {description: Equipment detail, content: {application/json: {schema: {$ref: '#/components/schemas/Equipment'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace}/drafts:
    parameters: [{$ref: '#/components/parameters/Workspace'}]
    get:
      description: Pending quick captures only; excluded from financial history and totals.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {in: query, name: equipmentId, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Paged pending drafts, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Page'}, {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Draft'}}}}]}}}}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      parameters: [{$ref: '#/components/parameters/Idempotency'}, {$ref: '#/components/parameters/Csrf'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [equipmentId]
              properties:
                equipmentId: {type: string, format: uuid}
                note: {type: [string, 'null'], maxLength: 1000}
      responses:
        '200': {description: Saved draft with no monetary amount or settlement, content: {application/json: {schema: {$ref: '#/components/schemas/Draft'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace}/drafts/{id}:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    get:
      responses:
        '200': {description: Pending draft, content: {application/json: {schema: {$ref: '#/components/schemas/Draft'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      description: Discard a never-posted draft; repeated discard returns the same state. Its attachments become inaccessible pending safe cleanup.
      parameters: [{$ref: '#/components/parameters/Csrf'}]
      responses:
        '200': {description: Discarded draft, content: {application/json: {schema: {$ref: '#/components/schemas/Draft'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace}/drafts/{id}/completion:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    post:
      description: Complete the draft in place as one single-equipment expense or income on its original equipment; retain attachment IDs and creator, record completer and audit.
      parameters: [{$ref: '#/components/parameters/Idempotency'}, {$ref: '#/components/parameters/Csrf'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [equipmentId, amount, operationDate]
              properties:
                equipmentId: {type: string, format: uuid}
                entryType: {type: string, enum: [EXPENSE, INCOME], default: EXPENSE}
                expenseScope: {type: string, enum: [SINGLE]}
                amount: {$ref: '#/components/schemas/Money'}
                category: {type: string, enum: [FUEL, MAINTENANCE, OTHER], description: Required for expenses; omitted for income}
                operationDate: {type: string, format: date}
                paidOn: {type: string, format: date}
                paymentStatus: {type: string, enum: [FULL, PARTIAL, UNPAID], default: FULL}
                initialPaid: {$ref: '#/components/schemas/Money'}
                partyName: {type: string, maxLength: 100}
                dueDate: {type: string, format: date}
                note: {type: [string, 'null'], maxLength: 1000, description: Omit to retain draft note}
      responses:
        '200': {description: Posted financial entry with the same ID and attachments, content: {application/json: {schema: {$ref: '#/components/schemas/Entry'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace}/entries:
    parameters: [{$ref: '#/components/parameters/Workspace'}]
    get:
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {in: query, name: equipmentId, schema: {type: string, format: uuid}}
        - {in: query, name: search, schema: {type: string, maxLength: 100}, description: Stored equipment name/reference, party name, note, or category; no receipt OCR}
        - {in: query, name: fromDate, schema: {type: string, format: date}, description: Inclusive operation date lower bound}
        - {in: query, name: toDate, schema: {type: string, format: date}, description: Inclusive operation date upper bound}
        - {in: query, name: entryType, schema: {type: string, enum: [EXPENSE, INCOME]}}
        - {in: query, name: generalExpense, schema: {type: boolean}, description: True selects general expenses; false excludes them}
        - {in: query, name: lifecycle, schema: {type: string, enum: [POSTED, CANCELLED]}, description: Drafts have a separate endpoint}
        - {in: query, name: settlementStatus, schema: {type: string, enum: [PAID, PARTIAL, UNPAID]}, description: Derived from original amount minus net settlements after refunds}
      responses:
        '200':
          description: Authorized filtered global or equipment ledger, newest creation first, page size 30; excludes drafts
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Page'}
                  - {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Entry'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      parameters: [{$ref: '#/components/parameters/Idempotency'}, {$ref: '#/components/parameters/Csrf'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount, operationDate]
              properties:
                equipmentId: {type: string, format: uuid, description: Required for single equipment expense and income; omitted for shared/general expense}
                expenseScope: {type: string, enum: [SINGLE, SHARED, GENERAL], default: SINGLE, description: Expenses only; income stays single-equipment}
                allocations:
                  type: array
                  description: Required for SHARED expense; distinct same-workspace equipment and explicit amounts summing exactly to entry total
                  items: {$ref: '#/components/schemas/AllocationInput'}
                entryType: {type: string, enum: [EXPENSE, INCOME], default: EXPENSE}
                amount: {$ref: '#/components/schemas/Money'}
                category: {type: string, enum: [FUEL, MAINTENANCE, OTHER], description: Required for expenses; omitted for income}
                operationDate: {type: string, format: date}
                paidOn: {type: string, format: date, description: Date of first payment or receipt; legacy field name retained for compatibility}
                paymentStatus: {type: string, enum: [FULL, PARTIAL, UNPAID], default: FULL}
                initialPaid: {$ref: '#/components/schemas/Money'}
                partyName: {type: string, maxLength: 100, description: Required when an amount remains}
                dueDate: {type: string, format: date, description: Optional when an amount remains}
                note: {type: [string, 'null'], maxLength: 1000}
                projectId: {type: [string, 'null'], format: uuid, description: Optional project/contract classification; money remains on this M2 entry}
      responses:
        '200': {description: One posted expense or income with optional initial settlement, or authorized replay, content: {application/json: {schema: {$ref: '#/components/schemas/Entry'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace}/entries/totals:
    parameters: [{$ref: '#/components/parameters/Workspace'}]
    get:
      description: Active original totals only. Shared expense counted once for workspace, by explicit allocation for equipment; general expense belongs only to workspace.
      parameters:
        - {in: query, name: equipmentId, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Active totals in SAR
          content:
            application/json:
              schema:
                type: object
                required: [expenseTotal, incomeTotal, generalExpenseTotal]
                properties:
                  expenseTotal: {$ref: '#/components/schemas/Money'}
                  incomeTotal: {$ref: '#/components/schemas/Money'}
                  generalExpenseTotal: {$ref: '#/components/schemas/Money'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace}/entries/{id}:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    get:
      responses:
        '200': {description: Original with dated settlements and refunds, content: {application/json: {schema: {$ref: '#/components/schemas/Entry'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    put:
      description: Edit a posted entry without changing its existing settlements. The total must be at least their sum.
      parameters: [{$ref: '#/components/parameters/Csrf'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount, operationDate]
              properties:
                amount: {$ref: '#/components/schemas/Money'}
                category: {type: string, enum: [FUEL, MAINTENANCE, OTHER], description: Required for expenses; omitted for income}
                operationDate: {type: string, format: date}
                note: {type: [string, 'null'], maxLength: 1000}
                partyName: {type: [string, 'null'], maxLength: 100, description: Required if an amount remains}
                dueDate: {type: [string, 'null'], format: date, description: Allowed only while an amount remains}
                equipmentId: {type: string, format: uuid, description: Required when changing expense to SINGLE scope}
                expenseScope: {type: string, enum: [SINGLE, SHARED, GENERAL], description: Expense only. Classification and allocations may change after financial movement while the original total remains unchanged. A cancelled entry cannot be edited.}
                allocations: {type: array, items: {$ref: '#/components/schemas/AllocationInput'}}
      responses:
        '200': {description: Updated entry with unchanged settlements, content: {application/json: {schema: {$ref: '#/components/schemas/Entry'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace}/entries/{id}/cancellation:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    post:
      description: Cancel an erroneous posted entry; existing settlements and attachments remain historical. This is not a refund.
      parameters: [{$ref: '#/components/parameters/Csrf'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '200': {description: Cancelled entry retained for history, content: {application/json: {schema: {$ref: '#/components/schemas/Entry'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace}/entries/{id}/settlements:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    post:
      parameters: [{$ref: '#/components/parameters/Idempotency'}, {$ref: '#/components/parameters/Csrf'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount, paidOn]
              properties:
                amount: {$ref: '#/components/schemas/Money'}
                paidOn: {type: string, format: date, description: Payment or receipt date; legacy field name retained for compatibility}
      responses:
        '200': {description: Updated original with its dated settlements, content: {application/json: {schema: {$ref: '#/components/schemas/Entry'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace}/entries/{id}/refunds:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    post:
      description: Record a dated return of previously settled money on an active entry. Original settlements remain immutable. If the refund leaves an outstanding amount and the original has no party, partyName is required and saved on the original.
      parameters: [{$ref: '#/components/parameters/Idempotency'}, {$ref: '#/components/parameters/Csrf'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount, refundedOn, reason]
              properties:
                amount: {$ref: '#/components/schemas/Money'}
                refundedOn: {type: string, format: date}
                reason: {type: string, minLength: 1, maxLength: 500}
                partyName: {type: string, minLength: 1, maxLength: 100, description: Required only when the refund leaves an outstanding amount and the original entry has no party}
      responses:
        '200': {description: Updated entry with its original settlements and dated refund history, content: {application/json: {schema: {$ref: '#/components/schemas/Entry'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace}/equipment/{equipment}/documents:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
      - {in: path, name: equipment, required: true, schema: {type: string, format: uuid}}
    get:
      description: Active document list by default; archived=true lists archived documents. Status is derived in Asia/Riyadh.
      responses:
        '200': {description: Document array}
        '404': {$ref: '#/components/responses/Error'}
    post:
      description: Create a document and version 1 with Idempotency-Key. Expiry is optional. A duplicate type is allowed after client warning.
      parameters: [{$ref: '#/components/parameters/Idempotency'}, {$ref: '#/components/parameters/Csrf'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentInput'}}}}
      responses:
        '200': {description: Created current document}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace}/equipment/{equipment}/documents/duplicates:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
      - {in: path, name: equipment, required: true, schema: {type: string, format: uuid}}
    get:
      description: List active same-type documents for an explicit warning; separate creation remains allowed.
      parameters:
        - {in: query, name: type, required: true, schema: {type: string}}
        - {in: query, name: customTypeName, schema: {type: string}}
      responses:
        '200': {description: Matching documents}
  /workspaces/{workspace}/documents/incomplete:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
    get:
      description: Active documents with no current expiry on active equipment.
      responses:
        '200': {description: Incomplete document array}
  /workspaces/{workspace}/documents/{id}:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    get:
      responses:
        '200': {description: Current document with derived status}
        '404': {$ref: '#/components/responses/Error'}
    put:
      description: Edit only the expected current version; type can change only before first renewal.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentEdit'}}}}
      responses:
        '200': {description: Updated current document}
        '409': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace}/documents/{id}/renewals:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    post:
      description: Atomically create successor only when expectedVersionId still identifies current version; expiry required.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentRenewal'}}}}
      responses:
        '200': {description: New current version}
        '409': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace}/documents/{id}/versions:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    get:
      responses:
        '200': {description: Versions newest first}
  /workspaces/{workspace}/documents/{id}/versions/{version}:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      - {in: path, name: version, required: true, schema: {type: string, format: uuid}}
    get:
      responses:
        '200': {description: Read-only version detail and derived previous marker}
        '404': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace}/documents/{id}/archive:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    post:
      description: Archive without deleting versions or attachments; optional reason in JSON body.
      responses:
        '200': {description: Archived document}
  /workspaces/{workspace}/documents/{id}/restore:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    post:
      description: Restore only while equipment is active; status is re-evaluated.
      responses:
        '200': {description: Restored document}
        '409': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace}/equipment/{id}/archive:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    post:
      responses:
        '200': {description: Archived equipment; history remains}
  /workspaces/{workspace}/equipment/{id}/restore:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    post:
      responses:
