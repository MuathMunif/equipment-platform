  /workspaces/{workspace}/projects:
    parameters: [{$ref: '#/components/parameters/Workspace'}]
    get:
      parameters:
        - {in: query, name: archived, schema: {type: boolean, default: false}}
        - {in: query, name: kind, schema: {type: string, enum: [PROJECT, CONTRACT]}}
        - {in: query, name: status, schema: {type: string, enum: [ACTIVE, COMPLETED]}}
        - {in: query, name: organizationId, schema: {type: string, format: uuid}}
        - {in: query, name: search, schema: {type: string, maxLength: 100}}
      responses: {'200': {description: Authorized unified project/contract list, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ProjectOrContract'}}}}}}
    post:
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectInput'}}}}
      responses: {'200': {description: Created ACTIVE project or contract}}
  /workspaces/{workspace}/projects/{id}:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    get:
      responses: {'200': {description: Full project detail only with project capability and scope}, '404': {$ref: '#/components/responses/Error'}}
    put:
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectInput'}}}}
      responses: {'200': {description: Updated project or contract}}
  /workspaces/{workspace}/projects/{id}/complete:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    post:
      responses: {'200': {description: COMPLETED; all active equipment links ended}}
  /workspaces/{workspace}/projects/{id}/reopen:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    post:
      responses: {'200': {description: ACTIVE; old equipment links remain ended}}
  /workspaces/{workspace}/projects/{id}/archive:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    post:
      responses: {'200': {description: Archived, preserving finance and attachment history}}
  /workspaces/{workspace}/projects/{id}/restore:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    post:
      responses: {'200': {description: Restored previous ACTIVE or COMPLETED status}}
  /workspaces/{workspace}/projects/{id}/equipment:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    get:
      responses: {'200': {description: Current and historical project equipment links}}
  /workspaces/{workspace}/projects/equipment/{equipment}/active-projects:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
      - {in: path, name: equipment, required: true, schema: {type: string, format: uuid}}
    get:
      description: Minimal active project context for an equipment detail; requires equipment view and project scope.
      responses: {'200': {description: Accessible active project and contract id, name and kind only}}
  /workspaces/{workspace}/projects/{id}/equipment/{equipment}:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
      - {$ref: '#/components/parameters/Id'}
      - {in: path, name: equipment, required: true, schema: {type: string, format: uuid}}
    post:
      responses: {'200': {description: New active equipment link}, '409': {$ref: '#/components/responses/Error'}}
    delete:
      responses: {'200': {description: Active link ended; history preserved}}
  /workspaces/{workspace}/projects/{id}/financial-summary:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    get:
      description: Requires PROJECT_VIEW and FINANCE_VIEW and current resource scope; all values derive from M2, difference is not profit.
      responses: {'200': {description: Exact SAR decimal strings for recordedIncome, recordedExpenses, recordedDifference, collected, paid, receivablesRemaining, payablesRemaining}, '404': {$ref: '#/components/responses/Error'}}
  /workspaces/{workspace}/projects/{project}/attachments:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
      - {in: path, name: project, required: true, schema: {type: string, format: uuid}}
    get:
      responses: {'200': {description: Project attachment metadata using full project access rules}}
    post:
      parameters: [{$ref: '#/components/parameters/Idempotency'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [filename, mediaType, size], properties: {filename: {type: string}, mediaType: {type: string, enum: [image/png, image/jpeg, application/pdf]}, size: {type: integer, maximum: 10485760}}}}}}
      responses: {'200': {description: 'PENDING project attachment; upload via existing attachment content endpoint'}}
  /workspaces/{workspace}/entries/{id}/project:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    put:
      description: Change or clear optional project classification on a POSTED entry, even after settlement or refund; monetary history is unchanged.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [projectId], properties: {projectId: {type: [string, 'null'], format: uuid}}}}}}
      responses: {'200': {description: Updated M2 entry}, '409': {$ref: '#/components/responses/Error'}}
  /workspaces/{workspace}/dashboard:
    get:
      summary: Scoped dashboard for current equipment and optional monthly recorded finance
      description: Month boundaries use Asia/Riyadh. EQUIPMENT_VIEW controls omission of activeEquipmentCount; FINANCE_VIEW controls omission of summary and recentEntries. At least one of those permissions is required. REPORT_VIEW is not required. Attention is fetched from the existing authorized attention API.
      parameters:
        - {name: workspace, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: month, in: query, schema: {type: string, pattern: '^\d{4}-\d{2}$'}}
      responses:
        '200':
          description: Equipment count and finance fields appear only when separately authorized
          content:
            application/json:
              schema:
                type: object
                required: [month, fromDate, toDate]
                properties:
                  month: {type: string, example: '2026-09'}
                  fromDate: {type: string, format: date}
                  toDate: {type: string, format: date}
                  activeEquipmentCount: {type: integer, format: int64}
                  summary: {$ref: '#/components/schemas/DashboardRecordedSummary'}
                  recentEntries:
                    type: array
                    maxItems: 5
                    items:
                      type: object
                      required: [entryId, entryType, amount, operationDate]
                      properties:
                        entryId: {type: string, format: uuid}
                        entryType: {type: string, enum: [INCOME, EXPENSE]}
                        amount: {$ref: '#/components/schemas/ReportMoney'}
                        operationDate: {type: string, format: date}
        '404': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace}/reports/recorded:
    get:
      summary: Posted original totals by operation date
      description: Requires REPORT_VIEW and FINANCE_VIEW. Summary includes every authorized matching row across pages. Equipment-filtered expense amount is its allocation share; entryTotal remains the original invoice.
      parameters:
        - {name: workspace, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: fromDate, in: query, required: true, schema: {type: string, format: date}}
        - {name: toDate, in: query, required: true, schema: {type: string, format: date}}
        - {name: equipmentId, in: query, schema: {type: string, format: uuid}}
        - {name: projectId, in: query, schema: {type: string, format: uuid}}
        - {name: entryType, in: query, schema: {type: string, enum: [INCOME, EXPENSE]}}
        - {name: generalExpense, in: query, schema: {type: boolean, default: false}, description: Select only general expenses; incompatible with equipmentId}
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: Recorded summary and one page of explaining entries
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordedReport'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace}/reports/movements:
    get:
      summary: Settlement and refund movements by their own movement dates
      description: Requires REPORT_VIEW and FINANCE_VIEW. Net values may be negative in a period. A restricted equipment's movement share uses M2 cent allocation with UUID tie break.
      parameters:
        - {name: workspace, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: fromDate, in: query, required: true, schema: {type: string, format: date}}
        - {name: toDate, in: query, required: true, schema: {type: string, format: date}}
        - {name: equipmentId, in: query, schema: {type: string, format: uuid}}
        - {name: projectId, in: query, schema: {type: string, format: uuid}}
        - {name: entryType, in: query, schema: {type: string, enum: [INCOME, EXPENSE]}}
        - {name: movementType, in: query, schema: {type: string, enum: [SETTLEMENT, REFUND]}}
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: Movement summary and one page of dated movement rows
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MovementReport'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace}/reports/outstanding:
    get:
      summary: Current receivables and payables across all entry periods
      description: Requires REPORT_VIEW and FINANCE_VIEW. As-of date is current Asia/Riyadh date; there is no historical snapshot or date range. Entry detail retains its own settlement permissions.
      parameters:
        - {name: workspace, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: equipmentId, in: query, schema: {type: string, format: uuid}}
        - {name: projectId, in: query, schema: {type: string, format: uuid}}
        - {name: entryType, in: query, schema: {type: string, enum: [INCOME, EXPENSE]}}
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: Current outstanding summary and one page of original entries
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OutstandingReport'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

components:
  securitySchemes:
    bearerSession: {type: http, scheme: bearer}
    cookieSession: {type: apiKey, in: cookie, name: equipment_session}
  parameters:
    Workspace: {in: path, name: workspace, required: true, schema: {type: string, format: uuid}}
    Id: {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    Page: {in: query, name: page, schema: {type: integer, minimum: 0, maximum: 100000, default: 0}}
    Idempotency: {in: header, name: Idempotency-Key, required: true, schema: {type: string, pattern: '^[a-zA-Z0-9_-]{8,100}$'}}
    Csrf: {in: header, name: X-CSRF-Token, required: false, description: Required for cookie-authenticated writes; omitted for Bearer clients, schema: {type: string}}
  responses:
    Error:
      description: Stable code and Arabic message. Cross-workspace and missing records both return NOT_FOUND.
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: {type: string}
              message: {type: string}
  schemas:
    ReportMoney: {type: string, pattern: '^-?[0-9]+\.[0-9]{2}$', description: Exact signed SAR decimal string}
    ReportPage:
      type: object
      required: [summary, items, page, pageSize, total]
      properties:
        page: {type: integer, minimum: 0}
        pageSize: {type: integer, const: 30}
        total: {type: integer, format: int64}
    RecordedSummary:
      type: object
      required: [recordedIncome, recordedExpenses, recordedDifference, fromDate, toDate, groups]
      properties:
        recordedIncome: {$ref: '#/components/schemas/ReportMoney'}
        recordedExpenses: {$ref: '#/components/schemas/ReportMoney'}
        recordedDifference: {$ref: '#/components/schemas/ReportMoney'}
        fromDate: {type: string, format: date}
        toDate: {type: string, format: date}
        groups:
          type: array
          description: Current equipment classification. A null equipmentId with generalExpense=true is the General expenses group. Each group's amount opens via equipmentId or generalExpense plus entryType.
          items:
            type: object
            required: [entryType, equipmentId, equipmentName, generalExpense, amount]
            properties:
              entryType: {type: string, enum: [INCOME, EXPENSE]}
              equipmentId: {type: [string, 'null'], format: uuid}
              equipmentName: {type: [string, 'null']}
              generalExpense: {type: boolean}
              amount: {$ref: '#/components/schemas/ReportMoney'}
    DashboardRecordedSummary:
      type: object
      description: Monthly recorded totals without equipment grouping metadata; groups are available only through reports.
      required: [recordedIncome, recordedExpenses, recordedDifference, fromDate, toDate]
      properties:
        recordedIncome: {$ref: '#/components/schemas/ReportMoney'}
        recordedExpenses: {$ref: '#/components/schemas/ReportMoney'}
        recordedDifference: {$ref: '#/components/schemas/ReportMoney'}
        fromDate: {type: string, format: date}
        toDate: {type: string, format: date}
    RecordedReport:
      allOf:
        - {$ref: '#/components/schemas/ReportPage'}
        - type: object
          properties:
            summary: {$ref: '#/components/schemas/RecordedSummary'}
            items:
              type: array
              items:
                type: object
                required: [entryId, entryType, operationDate, amount, entryTotal, expenseScope]
                properties:
                  entryId: {type: string, format: uuid}
                  entryType: {type: string, enum: [INCOME, EXPENSE]}
                  operationDate: {type: string, format: date}
                  amount: {$ref: '#/components/schemas/ReportMoney'}
                  entryTotal: {$ref: '#/components/schemas/ReportMoney'}
                  expenseScope: {type: string, enum: [SINGLE, SHARED, GENERAL]}
                  equipmentId: {type: [string, 'null'], format: uuid}
                  equipmentName: {type: [string, 'null']}
                  partyName: {type: [string, 'null']}
    MovementReport:
      allOf:
        - {$ref: '#/components/schemas/ReportPage'}
        - type: object
          properties:
            summary:
              type: object
              required: [collected, incomeRefunds, netCollected, paid, expenseRefunds, netPaid, fromDate, toDate]
              properties:
                collected: {$ref: '#/components/schemas/ReportMoney'}
                incomeRefunds: {$ref: '#/components/schemas/ReportMoney'}
                netCollected: {$ref: '#/components/schemas/ReportMoney'}
                paid: {$ref: '#/components/schemas/ReportMoney'}
                expenseRefunds: {$ref: '#/components/schemas/ReportMoney'}
                netPaid: {$ref: '#/components/schemas/ReportMoney'}
                fromDate: {type: string, format: date}
                toDate: {type: string, format: date}
            items:
              type: array
              items:
                type: object
                required: [movementId, entryId, entryType, movementType, movementDate, amount, movementTotal, entryTotal, expenseScope]
                properties:
                  movementId: {type: string, format: uuid}
                  entryId: {type: string, format: uuid}
                  entryType: {type: string, enum: [INCOME, EXPENSE]}
                  movementType: {type: string, enum: [SETTLEMENT, REFUND]}
                  movementDate: {type: string, format: date}
                  amount: {$ref: '#/components/schemas/ReportMoney'}
                  movementTotal: {$ref: '#/components/schemas/ReportMoney'}
                  entryTotal: {$ref: '#/components/schemas/ReportMoney'}
                  expenseScope: {type: string, enum: [SINGLE, SHARED, GENERAL]}
                  equipmentId: {type: [string, 'null'], format: uuid}
                  equipmentName: {type: [string, 'null']}
    OutstandingReport:
      allOf:
        - {$ref: '#/components/schemas/ReportPage'}
        - type: object
          properties:
            summary:
              type: object
              required: [receivable, payable, asOfDate]
              properties:
                receivable: {$ref: '#/components/schemas/ReportMoney'}
                payable: {$ref: '#/components/schemas/ReportMoney'}
                asOfDate: {type: string, format: date}
            items:
              type: array
              items:
                type: object
                required: [entryId, entryType, operationDate, overdue, remaining, entryTotal, expenseScope]
                properties:
                  entryId: {type: string, format: uuid}
                  entryType: {type: string, enum: [INCOME, EXPENSE]}
                  operationDate: {type: string, format: date}
                  dueDate: {type: [string, 'null'], format: date}
                  overdue: {type: boolean}
                  partyName: {type: [string, 'null']}
                  remaining: {$ref: '#/components/schemas/ReportMoney'}
                  entryTotal: {$ref: '#/components/schemas/ReportMoney'}
                  expenseScope: {type: string, enum: [SINGLE, SHARED, GENERAL]}
                  equipmentId: {type: [string, 'null'], format: uuid}
                  equipmentName: {type: [string, 'null']}

    EligibleDriver:
      type: object
      required: [userId, displayName, currentEquipmentId, currentEquipmentName, startedAt]
      properties:
        userId: {type: string, format: uuid}
        displayName: {type: string}
        currentEquipmentId: {type: [string, 'null'], format: uuid}
        currentEquipmentName: {type: [string, 'null']}
        startedAt: {type: [string, 'null'], format: date-time}
    CurrentEquipmentAssignment:
      type: object
      required: [equipmentId, assignmentId, driverUserId, driverName, startedAt]
      properties:
        equipmentId: {type: string, format: uuid}
        assignmentId: {type: [string, 'null'], format: uuid}
        driverUserId: {type: [string, 'null'], format: uuid}
        driverName: {type: [string, 'null']}
        startedAt: {type: [string, 'null'], format: date-time}
    TeamInvite:
      type: object
      required: [displayName, phone, role]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 100}
        phone: {type: string, description: Synthetic development number normalized to +9665...}
        role: {type: string, enum: [MANAGER, ACCOUNTANT, DRIVER]}
        scope: {type: string, enum: [ALL_EQUIPMENT, SELECTED_ORGANIZATIONS, SELECTED_EQUIPMENT], description: Omit for DRIVER}
        organizationIds: {type: array, items: {type: string, format: uuid}}
        equipmentIds: {type: array, items: {type: string, format: uuid}}
        capabilities: {type: array, uniqueItems: true, items: {type: string}}
        financialMode: {type: string, enum: [DIRECT, REVIEW]}
    MemberChange:
      type: object
      description: Omitted fields retain current values except role change resets capability defaults.
      properties:
        role: {type: string, enum: [MANAGER, ACCOUNTANT, DRIVER]}
        scope: {type: string, enum: [ALL_EQUIPMENT, SELECTED_ORGANIZATIONS, SELECTED_EQUIPMENT]}
        organizationIds: {type: array, items: {type: string, format: uuid}}
        equipmentIds: {type: array, items: {type: string, format: uuid}}
        capabilities: {type: array, uniqueItems: true, items: {type: string}}
        financialMode: {type: string, enum: [DIRECT, REVIEW]}
    SubmissionCreate:
      type: object
      description: Driver equipmentId is derived from current active assignment; if supplied it must match.
      properties:
        equipmentId: {type: string, format: uuid}
        amount: {$ref: '#/components/schemas/Money'}
        transactionDate: {type: string, format: date, description: Defaults to today in Asia/Riyadh}
        note: {type: string, maxLength: 1000}
        receipt:
          type: object
          required: [filename, mediaType, base64]
          properties:
            filename: {type: string, maxLength: 200}
            mediaType: {type: string, enum: [image/png, image/jpeg, application/pdf]}
            base64: {type: string, contentEncoding: base64, description: Maximum decoded size 10 MiB}
    EntryCreate:
      type: object
      description: Existing M2 expense creation shape; approval requires SINGLE expense for the submission equipment.
      required: [equipmentId, amount, category, operationDate]
      properties:
        equipmentId: {type: string, format: uuid}
        amount: {$ref: '#/components/schemas/Money'}
        category: {type: string, enum: [FUEL, MAINTENANCE, OTHER]}
        operationDate: {type: string, format: date}
        paidOn: {type: string, format: date}
        note: {type: string}
        paymentStatus: {type: string, enum: [FULL, PARTIAL, UNPAID]}
        initialPaid: {$ref: '#/components/schemas/Money'}
        partyName: {type: string}
        dueDate: {type: string, format: date}
        entryType: {const: EXPENSE}
        expenseScope: {const: SINGLE}
        projectId: {type: [string, 'null'], format: uuid, description: Reviewer may select before approval; driver submission has no project field}
    OrganizationInput:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        identifier: {type: [string, 'null'], maxLength: 100}
        notes: {type: [string, 'null'], maxLength: 1000}
    Organization:
      type: object
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        name: {type: string}
        identifier: {type: [string, 'null']}
        notes: {type: [string, 'null']}
        archived_at: {type: [string, 'null'], format: date-time}
        equipment_count: {type: integer}
        project_count: {type: integer}
    ProjectInput:
      type: object
      required: [kind, name]
      properties:
        kind: {type: string, enum: [PROJECT, CONTRACT]}
        name: {type: string, minLength: 1, maxLength: 100}
        organizationId: {type: [string, 'null'], format: uuid}
        clientName: {type: [string, 'null'], maxLength: 100}
        contractNumber: {type: [string, 'null'], maxLength: 100}
        startDate: {type: [string, 'null'], format: date}
        endDate: {type: [string, 'null'], format: date}
        notes: {type: [string, 'null'], maxLength: 1000}
    ProjectOrContract:
      type: object
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [PROJECT, CONTRACT]}
        name: {type: string}
        organization_id: {type: [string, 'null'], format: uuid}
        status: {type: string, enum: [ACTIVE, COMPLETED]}
        archived_at: {type: [string, 'null'], format: date-time}
    Money: {type: string, pattern: '^(0|[1-9][0-9]{0,8})\.[0-9]{2}$', example: '350.00'}
    IssueInput:
      type: object
      additionalProperties: false
      required: [description]
      properties:
        description: {type: string, minLength: 1, maxLength: 2000}
        type: {type: [string, 'null'], enum: [MECHANICAL, ELECTRICAL, TIRES, ACCIDENT_DAMAGE, OTHER, null]}
        equipmentStopped: {type: boolean, default: false}
    Issue:
      type: object
      properties:
        id: {type: string, format: uuid}
        reference: {type: string}
        equipmentId: {type: string, format: uuid}
        equipmentName: {type: string}
        description: {type: string}
        type: {type: [string, 'null']}
        equipmentStopped: {type: boolean}
        status: {type: string, enum: [OPEN, IN_PROGRESS, CLOSED]}
        resolution: {type: [string, 'null']}
        closedAt: {type: [string, 'null'], format: date-time}
        closures: {type: array, items: {type: object}}
        maintenance: {type: array, items: {type: object}}
    IssuePage:
      allOf: [{$ref: '#/components/schemas/Page'}, {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Issue'}}}}]
    MaintenanceInput:
      type: object
      additionalProperties: false
      required: [description, maintenanceDate]
      properties:
        description: {type: string, minLength: 1, maxLength: 2000}
        maintenanceDate: {type: string, format: date}
        type: {type: [string, 'null'], enum: [REPAIR, PERIODIC_SERVICE, INSPECTION, OTHER, null]}
        workshop: {type: [string, 'null'], maxLength: 200}
        issueId: {type: [string, 'null'], format: uuid}
    Maintenance:
      type: object
      properties:
        id: {type: string, format: uuid}
        equipmentId: {type: string, format: uuid}
        issueId: {type: [string, 'null'], format: uuid}
        description: {type: string}
        maintenanceDate: {type: string, format: date}
        type: {type: [string, 'null']}
        workshop: {type: [string, 'null']}
        cancelledAt: {type: [string, 'null'], format: date-time}
        cancellationReason: {type: [string, 'null']}
        expenses: {type: array, items: {$ref: '#/components/schemas/Entry'}}
        financialSummary: {type: object, description: Derived from linked M2 entries only}
    MaintenancePage:
      allOf: [{$ref: '#/components/schemas/Page'}, {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Maintenance'}}}}]
    Page:
      type: object
      required: [items, page, pageSize, total]
      properties:
        page: {type: integer}
        pageSize: {type: integer, const: 30}
        total: {type: integer}
    DocumentAttention:
      type: object
      required: [documentId, equipmentId, equipmentName, type, expiryDate, daysRemaining, status, body]
      properties:
        documentId: {type: string, format: uuid}
        equipmentId: {type: string, format: uuid}
        equipmentName: {type: string}
        type: {type: string, enum: [REGISTRATION, INSURANCE, PERIODIC_INSPECTION, LICENSE_PERMIT, OTHER]}
        customTypeName: {type: [string, 'null']}
        expiryDate: {type: string, format: date}
        daysRemaining: {type: integer, description: Negative after expiry}
        status: {type: string, enum: [EXPIRED, EXPIRES_TODAY, EXPIRING_SOON]}
        body: {type: string}
    Notification:
      type: object
      required: [id, type, entityType, entityId, title, body, templateKey, params, createdAt, readAt]
      properties:
        id: {type: string, format: uuid}
        type: {type: string, enum: [DOCUMENT_CURRENT_STATE, DOCUMENT_30D, DOCUMENT_7D, DOCUMENT_1D, DOCUMENT_TODAY, DOCUMENT_EXPIRED_WEEKLY]}
        entityType: {type: string, enum: [DOCUMENT, DOCUMENT_SUMMARY]}
        entityId: {type: [string, 'null'], format: uuid, description: Current document ID for individual alerts}
        title: {type: string}
        body: {type: string}
        templateKey: {type: [string, 'null'], enum: [DOCUMENT_EXPIRY, DOCUMENT_EXPIRED_WEEKLY, null], description: Null only for legacy notifications}
        params: {type: [object, 'null'], description: Semantic template parameters; legacy rows may be null}
        createdAt: {type: string, format: date-time}
        readAt: {type: [string, 'null'], format: date-time}
    NotificationPage:
      type: object
      required: [items, page, pageSize, total]
