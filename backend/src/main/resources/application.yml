spring:
  application:
    name: equipment-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:55432/equipment_dev}
    username: ${DB_USER:equipment_dev}
    password: ${DB_PASSWORD:local-development-only}
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
server:
  address: 127.0.0.1
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
app:
  dev-enabled: false
  storage-root: ${OBJECT_ROOT:../.local/objects}
  allowed-origins: http://localhost:8080,http://127.0.0.1:8080,http://localhost:8081,http://127.0.0.1:8081
  session-hours: 8
logging:
  level:
    org.springframework.web: WARN
